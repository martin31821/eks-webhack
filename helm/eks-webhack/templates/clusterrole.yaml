apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "eks-webhack.fullname" . }}
  labels:
    {{- include "eks-webhack.labels" . | nindent 4 }}
rules:
  # Read webhook configurations and CRDs to discover which services need proxying.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

  # Read nodes to resolve pod → node IP mappings.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

  # Manage services: read all, create/update/patch/delete NodePort clones,
  # and patch the selector of original webhook-backing services.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Manage EndpointSlices: read clone slices, create/update/patch/delete translated slices.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Leader election.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]

  # Emit events for observability.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
