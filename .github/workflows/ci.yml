name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  IMAGE: ghcr.io/martin31821/eks-webhack
  CHART_REPO: oci://ghcr.io/martin31821/charts

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
    - run: go tool golangci-lint run --timeout=5m -c .golangci.yml

  unit-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
    - run: go mod download
    - run: make test-verbose

  helm-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: azure/setup-helm@v5
    - run: helm lint helm/eks-webhack

  build-image:
    needs: [golangci-lint, unit-test, helm-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      if: github.event_name != 'pull_request'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE }}
        # semver tags also get "latest"; every build gets an immutable sha-<short> tag
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=ref,event=branch
          type=ref,event=pr
          type=sha
    - uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  release-helm-chart:
    needs: [build-image]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
    - uses: azure/setup-helm@v5
    - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
    - name: Package and push chart
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          CHART_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="${CHART_VERSION}"
        else
          CHART_VERSION="0.0.0-git+${GITHUB_SHA::7}"
          APP_VERSION="sha-${GITHUB_SHA::7}"
        fi
        echo "Setting chart version to ${CHART_VERSION} / appVersion to ${APP_VERSION}"
        (cd helm/eks-webhack && yq -i ".image.repository = \"${IMAGE}\"" values.yaml)
        (cd helm/eks-webhack && yq -i ".appVersion = \"${APP_VERSION}\"" Chart.yaml && yq -i ".version = \"${CHART_VERSION}\"" Chart.yaml)
        helm package helm/eks-webhack --destination releases
        helm push releases/*.tgz "${CHART_REPO}"
